caption_tones:
  sarcastic:
    id: sarcastic
    name: "Sarcastic & Witty"
    emoji: "😏"
    description: "Sharp, clever, slightly cynical humor"
    best_for: [tech, lifestyle, entertainment, personal_brand]
    llm_prompt: |
      Write a sarcastic, witty Instagram caption about: {topic}
      Industry context: {industry}

      Rules:
      - Be clever and ironic, not mean-spirited
      - Max 150 characters for body
      - Max 8 words for headline
      - 3-5 relevant hashtags

      Return ONLY valid JSON:
      {{"headline": "short punchy headline", "body": "the caption body", "hashtags": ["#tag1", "#tag2", "#tag3"]}}

