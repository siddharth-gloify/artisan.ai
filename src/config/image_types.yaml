image_types:

  # ── Photography ──────────────────────────────────────────────────────────────
  # Prompts are written the way an art director briefs a photographer — natural
  # language, light + lens character, believable imperfection. Avoid AI clichés
  # ("8K", "ultra detailed") which push models toward glossy digital-art looks.

  photo_cinematic:
    id: photo_cinematic
    name: "Cinematic Photo"
    category: photography
    description: "Wide-angle commercial photography, dramatic lighting, depth of field"
    prompt: "Commercial campaign photograph with cinematic wide-angle framing. Strong directional key light with rich shadow detail, sharp subject against a softly defocused background, teal-and-amber film-still color grade, anamorphic feel"
    photo_direction: "cinematic wide angle, dramatic key light, shallow depth of field, graded like a film still"
    use_palette: false

  photo_lifestyle:
    id: photo_lifestyle
    name: "Lifestyle Photo"
    category: photography
    description: "Bright clean lifestyle photography, natural light, editorial quality"
    prompt: "Bright airy lifestyle editorial photograph. Soft natural window light or open shade, genuine candid moment mid-action, light neutral environment, gentle warm grade like a premium lifestyle magazine spread"
    photo_direction: "bright natural daylight, candid editorial moment, airy and real"
    use_palette: false

  photo_dramatic:
    id: photo_dramatic
    name: "Dramatic Dark Photo"
    category: photography
    description: "Dark moody photography with high contrast and intense atmosphere"
    prompt: "Low-key dramatic photograph. Single hard light source carving the subject out of deep shadow, chiaroscuro contrast, moody atmosphere like an album cover or premium spirits campaign, blacks kept rich not crushed"
    photo_direction: "low-key single source light, deep shadow, moody chiaroscuro"
    use_palette: false

  photo_aerial:
    id: photo_aerial
    name: "Wide / Aerial Photo"
    category: photography
    description: "Wide establishing shots, panoramic perspectives, epic scale"
    prompt: "Wide cinematic establishing shot or high drone perspective at golden hour. Sweeping scale with layered depth, warm low sunlight raking across the scene, gentle atmospheric haze in the distance"
    photo_direction: "wide establishing shot, golden hour, layered depth, atmospheric"
    use_palette: false

  photo_portrait:
    id: photo_portrait
    name: "Portrait Photo"
    category: photography
    description: "Professional portrait, subject-focused, clean background"
    prompt: "Editorial portrait with an 85mm prime look. Tack-sharp eyes, creamy background separation, soft directional key light with gentle fill, genuine relaxed expression caught between poses, natural skin texture preserved"
    photo_direction: "85mm portrait, soft key light, sharp eyes, genuine expression"
    use_palette: false

  photo_golden_hour:
    id: photo_golden_hour
    name: "Golden Hour Candid"
    category: photography
    description: "Warm backlit candid moment in the last hour of sunlight"
    prompt: "Candid photograph in the last hour of warm sunlight. Subject gently backlit with a glowing rim of light and natural lens flare, long soft shadows, honest unposed body language, warm nostalgic grade"
    photo_direction: "golden hour backlight, lens flare, candid unposed, warm nostalgic"
    use_palette: false

  photo_film_analog:
    id: photo_film_analog
    name: "35mm Film Look"
    category: photography
    description: "Analog film aesthetic — soft grain, faded blacks, timeless tones"
    prompt: "Photograph with a 35mm analog film aesthetic, like Kodak Portra 400. Soft visible grain, slightly lifted faded blacks, gentle halation around highlights, muted true-to-life tones, unhurried documentary framing"
    photo_direction: "35mm film stock look, visible grain, faded blacks, documentary framing"
    use_palette: false

  photo_macro_detail:
    id: photo_macro_detail
    name: "Macro Detail"
    category: photography
    description: "Intimate close-up of texture, craft, or product detail"
    prompt: "Intimate macro close-up photograph of fine detail and texture. Razor-thin plane of focus melting into smooth bokeh, soft diffused side light revealing surface character, quiet uncluttered backdrop"
    photo_direction: "macro close-up, thin focus plane, texture and craft detail"
    use_palette: false

  photo_architectural:
    id: photo_architectural
    name: "Architectural Minimal"
    category: photography
    description: "Clean lines, negative space, calm geometric composition"
    prompt: "Minimal architectural photograph. Clean converging lines and strong geometry, generous negative space, soft even daylight, calm restrained palette, composition balanced like a design magazine cover"
    photo_direction: "architectural minimal, clean geometry, negative space, soft daylight"
    use_palette: false

  photo_mono:
    id: photo_mono
    name: "Black & White Editorial"
    category: photography
    description: "Timeless monochrome with strong tonal contrast"
    prompt: "Black and white editorial photograph. Full tonal range from deep blacks to clean highlights, strong graphic composition, timeless reportage feel like a Magnum print, subtle silver-gelatin grain"
    photo_direction: "black and white, strong tonal contrast, timeless reportage"
    use_palette: false

  photo_studio_product:
    id: photo_studio_product
    name: "Studio Product"
    category: photography
    description: "Controlled studio product shot on seamless backdrop"
    prompt: "Studio product photograph on a seamless backdrop. Controlled softbox lighting with crisp clean reflections and a soft contact shadow, hero product angle, premium e-commerce campaign quality"
    photo_direction: "studio seamless backdrop, softbox light, hero product angle, contact shadow"
    use_palette: true

  # ── Illustration & 3D ─────────────────────────────────────────────────────────

  illustration_3d_festive:
    id: illustration_3d_festive
    name: "3D Festive Illustration"
    category: illustration
    description: "Vibrant 3D rendered festive scene for holidays and celebrations"
    prompt: "Professional 3D rendered festive illustration, vibrant celebratory scene, centered subject on soft gradient background, smooth studio lighting, clean joyful composition"
    photo_direction: "3D festive illustration, soft gradient background, centered, celebratory"
    use_palette: true

  illustration_3d_clean:
    id: illustration_3d_clean
    name: "3D Clean Object"
    category: illustration
    description: "Clean 3D product or concept visualization on neutral background"
    prompt: "Professional 3D product visualization, clean neutral studio background, sharp detailed rendering, modern 3D art, dramatic studio lighting"
    photo_direction: "3D render, studio lighting, clean neutral background, product visualization"
    use_palette: true

  # ── Graphic & Abstract ────────────────────────────────────────────────────────

  gradient_vibrant:
    id: gradient_vibrant
    name: "Vibrant Gradient"
    category: graphic
    description: "Bold dynamic gradient abstract background"
    prompt: "Vibrant gradient abstract background, dynamic color transitions, bold graphic design, high energy, smooth gradient mesh, abstract geometric shapes"
    photo_direction: "vibrant gradient, abstract, bold colors, high energy"
    use_palette: true

  gradient_soft:
    id: gradient_soft
    name: "Soft Gradient"
    category: graphic
    description: "Gentle pastel gradient, calm and soothing"
    prompt: "Soft pastel gradient background, gentle color transitions, airy light atmosphere, modern minimal aesthetic, dreamy soft tones"
    photo_direction: "soft pastel gradient, gentle tones, minimal, calm"
    use_palette: true

  minimal_texture:
    id: minimal_texture
    name: "Minimal Texture"
    category: graphic
    description: "Clean minimal background with subtle texture and depth"
    prompt: "Clean minimalist background with subtle paper or fabric texture, professional design, muted elegant tones, abstract minimal composition, studio quality"
    photo_direction: "minimal texture, clean, subtle depth, professional"
    use_palette: true

image_type_categories:
  photography:
    label: "Photography"
    description: "Real-world photography styles"
  illustration:
    label: "Illustration & 3D"
    description: "Illustrated and 3D rendered backgrounds"
  graphic:
    label: "Graphic & Abstract"
    description: "Gradient, pattern, and abstract backgrounds"
